name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - name: Check community CSS rules
              if: matrix.node-version == '22.x'
              run: npm run lint:css
            - name: Audit all public CSS sources and assets
              if: matrix.node-version == '22.x'
              run: npm run audit:css:public -- --output public-css-audit.json
            - name: Upload public CSS audit
              if: always() && matrix.node-version == '22.x'
              uses: actions/upload-artifact@v4
              with:
                  name: public-css-audit
                  path: public-css-audit.json
