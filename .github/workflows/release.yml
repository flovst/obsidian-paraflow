name: Release Obsidian plugin

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag matching manifest.json
                required: true
                type: string
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release tag
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              shell: bash
              run: |
                  tag="$RELEASE_TAG"
                  version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"

                  if [[ "$tag" != "$version" ]]; then
                    echo "Release tag '$tag' must match manifest version '$version'." >&2
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Lint plugin
              run: npm run lint

            - name: Build plugin
              run: npm run build

            - name: Check community CSS rules
              run: npm run lint:css

            - name: Attest required plugin assets
              if: ${{ !github.event.repository.private }}
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json

            - name: Attest optional styles
              if: ${{ !github.event.repository.private && hashFiles('styles.css') != '' }}
              uses: actions/attest@v4
              with:
                  subject-path: styles.css

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              shell: bash
              run: |
                  tag="$RELEASE_TAG"
                  assets=(main.js manifest.json)

                  if [[ -f styles.css ]]; then
                    assets+=(styles.css)
                  fi

                  gh release create "$tag" \
                    --verify-tag \
                    --title="$tag" \
                    --draft \
                    "${assets[@]}"
